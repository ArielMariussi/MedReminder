name: CI/CD - Med Reminder

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-api:
    name: Build and Deploy API (Render)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish Med.Api/Med.Api.csproj -c Release -o ./publish/api

      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}'

  build-and-deploy-web:
    name: Build and Deploy Frontend (Vercel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Clear dotnet cache
        run: dotnet nuget locals all --clear

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Frontend
        run: dotnet publish Med.Web/Med.Web.csproj -c Release -o ./publish/web

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          # Without these two, the CLI doesn't know which project to publish to and creates a
          # new one from the folder name (wwwroot), which nobody accesses.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} ./publish/web/wwwroot